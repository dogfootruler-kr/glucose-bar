# Runs every test on each push and pull request: the server's (Python standard library only),
# the Mac app's (swift test) and the Android app's unit tests (debug build, no signing secrets needed).
name: Tests
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Server tests
        run: python3 -m unittest discover -s server/tests -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'

  mac:
    runs-on: xcode-27  # same SDK as the release build
    steps:
      - uses: actions/checkout@v7
      - name: Mac app tests
        working-directory: app
        run: swift test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Android unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest
