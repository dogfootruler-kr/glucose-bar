<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glucose</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --fg: #15171c; --muted: #6b7280; --grid: #e5e7eb;
          --line: #2563eb; --ok: #16a34a; --low: #dc2626; --high: #ea580c; --band: rgba(22,163,74,.10);
          --meal: #ea580c; --insulin: #9333ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --card: #171b23; --fg: #e8eaf0; --muted: #8b93a3; --grid: #262c38;
            --line: #7cb8ff; --band: rgba(74,222,128,.10); --meal: #fb923c; --insulin: #c084fc; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  .card { background: var(--card); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .now { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .value { font-size: 64px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1; }
  .arrow { font-size: 40px; }
  .muted { color: var(--muted); }
  .warn { color: var(--low); font-weight: 600; }
  .seg { display: flex; gap: 6px; margin-bottom: 10px; }
  .seg button { flex: 1; border: 0; border-radius: 8px; padding: 6px; background: var(--grid); color: var(--fg); font: inherit; cursor: pointer; }
  .seg button.on { background: var(--line); color: #fff; }
  .plot { position: relative; }
  svg { width: 100%; height: 220px; display: block; touch-action: pan-y; }
  .tip { position: absolute; top: 0; pointer-events: none; transform: translateX(-50%); white-space: nowrap;
         background: var(--card); border: 1px solid var(--grid); border-radius: 8px; padding: 4px 8px;
         font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: none; z-index: 2; }
  .tip b { font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .stats b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  label { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
  input, select, textarea { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--grid); border-radius: 8px; padding: 8px 10px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .btn { border: 0; border-radius: 8px; padding: 9px 14px; font: inherit; cursor: pointer; background: var(--grid); color: var(--fg); }
  .btn.primary { background: var(--line); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .jhead { display: flex; gap: 8px; margin-bottom: 8px; }
  .jhead .seg { flex: 1; margin: 0; }
  .jhead select { width: auto; padding: 6px 8px; }
  details.day { border-top: 1px solid var(--grid); }
  details.day:first-of-type { border-top: 0; }
  details.day > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline;
                          gap: 8px; padding: 10px 0; font-weight: 600; }
  details.day > summary::-webkit-details-marker { display: none; }
  details.day > summary::before { content: '›'; display: inline-block; width: 12px; color: var(--muted); transition: transform .15s; }
  details.day[open] > summary::before { transform: rotate(90deg); }
  details.day > summary .day-name { flex: 1; }
  details.day > summary .totals { font-weight: 400; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .entry { border-radius: 10px; margin: 0 -8px; padding: 6px 8px; cursor: pointer; }
  .entry:hover { background: var(--bg); }
  .entry.open { background: var(--bg); }
  .entry .row { display: flex; gap: 10px; align-items: center; }
  .thumb { width: 40px; height: 40px; border-radius: 9px; object-fit: cover; flex: none; display: grid; place-items: center; font-size: 18px; }
  .thumb.meal { background: rgba(234,88,12,.15); }
  .thumb.insulin { width: 28px; height: 28px; margin: 0 6px; border-radius: 7px; font-size: 14px; background: rgba(147,51,234,.15); }
  .entry .info { flex: 1; min-width: 0; }
  .entry .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; text-align: right; flex: none; line-height: 1.1; }
  .score small { display: block; font-size: 10px; font-weight: 500; }
  .more { display: none; padding: 8px 0 4px 50px; font-size: 13px; }
  .entry.open .more { display: block; }
  .more .facts { color: var(--muted); }
  .more .facts div { margin: 2px 0; }
  .entry-actions { display: flex; gap: 8px; margin-top: 8px; }
  .entry-actions .btn { padding: 6px 12px; font-size: 13px; }
  .showall { margin-top: 8px; }
  .summary h3 { font-size: 15px; margin: 12px 0 4px; }
  .summary ul { margin: 4px 0; padding-left: 20px; }
  .summary p { margin: 6px 0; }
  .preview { max-width: 100%; max-height: 180px; border-radius: 8px; margin-top: 8px; display: none; }
  .small { font-size: 13px; }
  .dose { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--bg); }
  .dose b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .dose details { margin-top: 6px; } .dose table { width: 100%; font-size: 13px; border-collapse: collapse; }
  .dose td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 8px; }
  .check { display: flex; gap: 8px; align-items: center; margin: 10px 0 0; color: var(--fg); font-size: 15px; }
  .check input { width: auto; }
  .btn.danger { color: var(--low); }
  .linkbtn { background: none; border: 0; color: var(--line); font: inherit; font-size: 13px; cursor: pointer; padding: 0; text-transform: none; letter-spacing: 0; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="now"><span class="value" id="value">–</span><span class="arrow" id="arrow"></span><span class="muted" id="delta"></span></div>
    <div class="muted" id="when">Loading…</div>
    <div id="forecast" class="small"></div>
    <div id="insulin" class="small muted"></div>
  </div>
  <div class="card">
    <div class="seg" id="seg"></div>
    <div class="plot">
      <svg id="chart" viewBox="0 0 600 220" preserveAspectRatio="none"></svg>
      <div class="tip" id="tip"></div>
    </div>
  </div>

  <div class="card" id="log">
    <h2><span id="logTitle">Log</span> <button class="linkbtn" id="cancelEdit" style="display:none">Cancel edit</button></h2>
    <div class="seg" id="kind">
      <button data-kind="meal" class="on">🍽 Meal</button>
      <button data-kind="insulin">💉 Insulin</button>
    </div>
    <div id="mealForm">
      <label for="photo">Photo</label>
      <input type="file" id="photo" accept="image/*">
      <img id="preview" class="preview" alt="">
      <label for="mealNote">What did you eat?</label>
      <input id="mealNote" placeholder="e.g. Kimchi jjigae with rice">
      <div class="actions"><button class="btn" id="estimate">✨ Estimate carbs with Claude</button></div>
      <div id="estimateResult" class="small muted"></div>
      <label for="carbs">Carbs (g)</label>
      <input id="carbs" type="number" inputmode="decimal" min="0">
      <div id="doseBox" class="dose" style="display:none"></div>
      <label class="check" id="alsoDoseRow" style="display:none"><input type="checkbox" id="alsoDose"> Also log <input id="doseUnits" type="number" step="0.5" min="0" style="width:70px"> u rapid insulin</label>
    </div>
    <div id="insulinForm" style="display:none">
      <div class="row">
        <div><label for="units">Units</label><input id="units" type="number" inputmode="decimal" step="0.5" min="0" value="1"></div>
        <div><label for="itype">Type</label><select id="itype"><option value="rapid">Rapid-acting</option><option value="long">Long-acting</option></select></div>
      </div>
      <label for="insNote">Note</label>
      <input id="insNote" placeholder="Optional">
    </div>
    <label for="time">Time</label>
    <input id="time" type="datetime-local">
    <div class="actions"><button class="btn primary" id="save">Save</button><button class="btn danger" id="deleteEntry" style="display:none">Delete</button><span id="saveMsg" class="small muted"></span></div>
  </div>

  <div class="card" id="meals">
    <h2>Journal</h2>
    <div class="jhead">
      <div class="seg" id="jfilter">
        <button data-filter="all" class="on">All</button><button data-filter="meal">Meals</button><button data-filter="insulin">Insulin</button>
      </div>
      <select id="jsort" aria-label="Sort">
        <option value="recent">By day</option><option value="best">Easiest first</option><option value="worst">Hardest first</option>
      </select>
    </div>
    <div id="mealList" class="muted small">Nothing logged yet.</div>
    <div class="muted small" style="margin-top:10px">Meal score: how gently glucose rose in the first 90 minutes, so a dose that was off doesn't count against the food. Tap an entry for details.</div>
  </div>

  <div class="card"><h2>Today</h2><div class="stats" id="today"></div></div>
  <div class="card"><h2>Last 7 days</h2><div class="stats" id="week"></div></div>

  <div class="card" id="summary">
    <h2>Weekly summary <button class="linkbtn" id="genSummary">Write now</button></h2>
    <div id="summaryText" class="summary muted small">Loading…</div>
  </div>
</main>
<script>
const LOW = 70, HIGH = 180;
let hours = 6, mealSort = 'recent', meals = [], entries = [], aiAvailable = false;
let plotted = [], plottedEvents = [], scaleX = null, scaleY = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);
const fmtTime = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const fmtU = u => Number.isInteger(u) ? u : u.toFixed(1);

const seg = $('seg');
[3, 6, 12, 24].forEach(h => {
  const b = document.createElement('button');
  b.textContent = h + 'h';
  b.onclick = () => { hours = h; load(); };
  seg.appendChild(b);
});

function color(v) { return v < LOW ? 'var(--low)' : v > HIGH ? 'var(--high)' : 'var(--ok)'; }
function eventLabel(e) {
  return e.kind === 'meal'
    ? `🍽 ${esc(e.note || 'Meal')}${e.carbs != null ? ` · ${Math.round(e.carbs)} g` : ''}`
    : `💉 ${fmtU(e.units || 0)} u ${esc(e.insulinType || 'rapid')}`;
}

function draw(points, forecast, events) {
  const svg = $('chart');
  const W = 600, H = 220, now = Date.now(), t0 = now - hours * 3600e3;
  const fpts = forecast ? forecast.points : [];
  const t1 = fpts.length ? Date.parse(fpts[fpts.length - 1].timestamp) : now;
  const max = Math.max(250, ...points.concat(fpts).map(p => p.mgdl + 30)), min = 40;
  const x = t => (t - t0) / (t1 - t0) * W, y = v => H - (v - min) / (max - min) * H;
  let s = `<rect x="0" y="${y(HIGH)}" width="${W}" height="${y(LOW) - y(HIGH)}" fill="var(--band)"/>`;
  for (const v of [LOW, HIGH]) s += `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-dasharray="4 4"/>`;
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(Date.parse(p.timestamp)).toFixed(1)},${y(p.mgdl).toFixed(1)}`).join('');
  s += `<path d="${d}" fill="none" stroke="var(--line)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  const last = points[points.length - 1];
  if (last && fpts.length) {
    const fd = [last, ...fpts].map((p, i) => `${i ? 'L' : 'M'}${x(Date.parse(p.timestamp)).toFixed(1)},${y(p.mgdl).toFixed(1)}`).join('');
    s += `<path d="${fd}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>`;
  }
  if (last) s += `<circle cx="${x(Date.parse(last.timestamp))}" cy="${y(last.mgdl)}" r="5" fill="${color(last.mgdl)}"/>`;
  for (const e of events) {
    const ex = x(Date.parse(e.timestamp));
    s += `<line x1="${ex}" x2="${ex}" y1="14" y2="${H}" stroke="${e.kind === 'meal' ? 'var(--meal)' : 'var(--insulin)'}" stroke-opacity=".35" vector-effect="non-scaling-stroke"/>`;
    s += `<circle cx="${ex}" cy="10" r="5" fill="${e.kind === 'meal' ? 'var(--meal)' : 'var(--insulin)'}"/>`;
  }
  s += `<g id="hover" style="display:none"><line id="hl" y1="0" y2="${H}" stroke="var(--muted)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/><circle id="hc" r="5" stroke="var(--card)" stroke-width="2"/></g>`;
  svg.innerHTML = s;
  plotted = points; plottedEvents = events; scaleX = x; scaleY = y;
}

const svgEl = $('chart'), tip = $('tip');
function hover(clientX) {
  if (!plotted.length) return;
  const box = svgEl.getBoundingClientRect();
  const vx = (clientX - box.left) / box.width * 600;
  let best = plotted[0], bestDist = Infinity;
  for (const p of plotted) {
    const d = Math.abs(scaleX(Date.parse(p.timestamp)) - vx);
    if (d < bestDist) { best = p; bestDist = d; }
  }
  const px = scaleX(Date.parse(best.timestamp)), py = scaleY(best.mgdl);
  $('hover').style.display = '';
  $('hl').setAttribute('x1', px); $('hl').setAttribute('x2', px);
  $('hc').setAttribute('cx', px); $('hc').setAttribute('cy', py); $('hc').setAttribute('fill', color(best.mgdl));
  const near = plottedEvents.filter(e => Math.abs(scaleX(Date.parse(e.timestamp)) - vx) < 12);
  tip.innerHTML = `<b>${best.mgdl}</b> mg/dL · ${(best.mgdl / 18.0182).toFixed(1)} mmol/L<br><span class="muted">${fmtTime(best.timestamp)}</span>`
    + near.map(e => `<br>${eventLabel(e)} <span class="muted">${fmtTime(e.timestamp)}</span>`).join('');
  tip.style.display = 'block';
  const left = px / 600 * box.width, half = tip.offsetWidth / 2;
  tip.style.left = Math.min(Math.max(left, half), box.width - half) + 'px';
  tip.style.top = Math.max(py / 220 * box.height - tip.offsetHeight - 12, -tip.offsetHeight - 4) + 'px';
}
function unhover() { tip.style.display = 'none'; const g = $('hover'); if (g) g.style.display = 'none'; }
svgEl.addEventListener('pointermove', e => hover(e.clientX));
svgEl.addEventListener('pointerdown', e => hover(e.clientX));
svgEl.addEventListener('pointerleave', unhover);

function statBlock(id, s) {
  $(id).innerHTML = s
    ? `<div><b>${s.inRange}%</b><span class="muted">in range</span></div>
       <div><b>${s.average}</b><span class="muted">avg mg/dL</span></div>
       <div><b>${s.gmi}%</b><span class="muted">A1c est.</span></div>`
    : '<div class="muted">No data yet</div>';
}

function renderForecast(fc) {
  const el = $('forecast');
  el.className = 'small'; el.textContent = '';
  if (!fc) return;
  if (fc.slope < 0 && fc.from > LOW) {
    const mins = (LOW - fc.from) / fc.slope;
    if (mins <= 30) {
      el.className = 'small warn';
      el.textContent = `⚠ Heading low: ${LOW} around ${fmtTime(Date.parse(fc.fromTimestamp) + mins * 60e3)}`;
      return;
    }
  }
  const v = fc.points[fc.points.length - 1].mgdl;
  if (Math.abs(fc.slope) >= 1) { el.className = 'small muted'; el.textContent = `About ${v} in 30 min if the trend continues`; }
}

function renderInsulin(events) {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  let rapid = 0, long = 0;
  for (const e of events) if (e.kind === 'insulin' && Date.parse(e.timestamp) >= start) (e.insulinType === 'long' ? (long += e.units || 0) : (rapid += e.units || 0));
  $('insulin').textContent = rapid + long ? `💉 Today: ${fmtU(rapid)} u rapid · ${fmtU(long)} u long` : '';
}

const VERDICTS = { ok: ['Dose about right', 'var(--ok)'], tooLittle: ['Dose too low', 'var(--high)'], tooMuch: ['Dose too high', 'var(--high)'] };
let jFilter = 'all', expanded = null, showAll = false;
const openDays = new Set(), closedDays = new Set();
const dayKey = t => new Date(t).toDateString();
function dayName(key) {
  const d = new Date(key), today = new Date(), y = new Date(); y.setDate(today.getDate() - 1);
  if (key === today.toDateString()) return 'Today';
  if (key === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
}
function dayTotals(list) {
  let carbs = 0, rapid = 0, long = 0;
  for (const e of list) {
    if (e.kind === 'meal') carbs += e.carbs || 0;
    else if (e.insulinType === 'long') long += e.units || 0; else rapid += e.units || 0;
  }
  return [carbs ? `${Math.round(carbs)} g` : null, rapid ? `${fmtU(rapid)} u rapid` : null, long ? `${fmtU(long)} u long` : null].filter(Boolean).join(' · ');
}
function entryHTML(e, byId, withDay) {
  const m = byId[e.id], i = m && m.impact, d = m && m.dose;
  const when = new Date(e.timestamp).toLocaleString([], withDay ? { weekday: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' } : { hour: '2-digit', minute: '2-digit' });
  const open = expanded === e.id ? ' open' : '';
  const actions = `<div class="entry-actions"><button class="btn" data-edit="${e.id}">Edit</button><button class="btn danger" data-del="${e.id}">Delete</button></div>`;
  if (e.kind !== 'meal') {
    const name = `${fmtU(e.units || 0)} u ${e.insulinType === 'long' ? 'long-acting' : 'rapid'}`;
    return `<div class="entry${open}" data-id="${e.id}"><div class="row"><div class="thumb insulin">💉</div><div class="info"><div class="name">${name}</div>`
      + `<div class="muted small">${[when, esc(e.note)].filter(Boolean).join(' · ')}</div></div></div><div class="more">${actions}</div></div>`;
  }
  const sc = i ? (i.foodScore ?? i.score) : null;
  const v = d && VERDICTS[d.verdict];
  const badge = sc != null
    ? `<div class="score" style="color:${sc >= 80 ? 'var(--ok)' : sc >= 50 ? 'var(--high)' : 'var(--low)'}">${sc}<small style="color:${v ? v[1] : 'var(--muted)'}">${v ? v[0] : i.complete ? '' : 'so far'}</small></div>`
    : '';
  const bits = [when, e.carbs != null ? `${Math.round(e.carbs)} g` : null, d && d.units ? `${fmtU(d.units)} u` : null].filter(Boolean).join(' · ');
  const img = e.photo ? `<img class="thumb" src="${e.photo}" alt="" loading="lazy">` : '<div class="thumb meal">🍽</div>';
  const facts = [];
  if (i) {
    facts.push(`Rose ${i.earlyRise ?? i.rise} in the first 90 min, peak ${i.peak} after ${i.minutesToPeak} min`);
    if (i.minutesAboveHigh) facts.push(`${i.minutesAboveHigh} min above range`);
  }
  if (d) {
    if (d.units) facts.push(`${fmtU(d.units)} u rapid${d.minutesFromMeal == null || Math.abs(d.minutesFromMeal) < 3 ? ' when eating' : d.minutesFromMeal < 0 ? `, ${-d.minutesFromMeal} min before eating` : `, ${d.minutesFromMeal} min after eating`}`);
    if (d.reason) facts.push(`${v ? `<b style="color:${v[1]}">${v[0]}:</b> ` : ''}${esc(d.reason)}`);
    if (d.suggested != null) facts.push(`Your usual ratio: ${fmtU(d.suggested)} u for ${Math.round(d.carbs)} g`);
  }
  return `<div class="entry${open}" data-id="${e.id}"><div class="row">${img}<div class="info"><div class="name">${esc(e.note || 'Meal')}</div><div class="muted small">${bits}</div></div>${badge}</div>`
    + `<div class="more"><div class="facts">${facts.map(f => `<div>${f}</div>`).join('')}</div>${actions}</div></div>`;
}
function renderMeals() {
  const byId = Object.fromEntries(meals.map(m => [m.id, m]));
  const score = e => byId[e.id] && byId[e.id].impact ? (byId[e.id].impact.foodScore ?? byId[e.id].impact.score) : null;
  document.querySelectorAll('[data-filter]').forEach(b => b.classList.toggle('on', b.dataset.filter === jFilter));
  $('jsort').value = mealSort;
  let list = entries.filter(e => jFilter === 'all' || e.kind === jFilter);
  let html;
  if (mealSort === 'recent') {
    const days = new Map();
    for (const e of list.slice().reverse()) {
      const k = dayKey(e.timestamp);
      if (!days.has(k)) days.set(k, []);
      days.get(k).push(e);
    }
    html = [...days].map(([k, es], idx) => {
      const open = openDays.has(k) || (idx < 2 && !closedDays.has(k));
      return `<details class="day" data-day="${esc(k)}"${open ? ' open' : ''}><summary><span class="day-name">${dayName(k)}</span><span class="totals">${dayTotals(es)}</span></summary>`
        + es.map(e => entryHTML(e, byId, false)).join('') + '</details>';
    }).join('');
  } else {
    list = list.filter(e => score(e) != null).sort((a, b) => mealSort === 'best' ? score(b) - score(a) : score(a) - score(b));
    const shown = showAll ? list : list.slice(0, 10);
    html = shown.map(e => entryHTML(e, byId, true)).join('')
      + (list.length > shown.length ? `<button class="linkbtn showall" id="showAll">Show all ${list.length} meals</button>` : '');
  }
  $('mealList').innerHTML = html || '<span class="muted small">Nothing logged yet.</span>';
  if ($('showAll')) $('showAll').onclick = () => { showAll = true; renderMeals(); };
  document.querySelectorAll('details.day').forEach(dt => dt.ontoggle = () => {
    const k = dt.dataset.day;
    if (dt.open) { openDays.add(k); closedDays.delete(k); } else { closedDays.add(k); openDays.delete(k); }
  });
  document.querySelectorAll('.entry').forEach(el => el.onclick = ev => {
    if (ev.target.closest('button')) return;
    const id = Number(el.dataset.id);
    expanded = expanded === id ? null : id;
    document.querySelectorAll('.entry').forEach(x => x.classList.toggle('open', Number(x.dataset.id) === expanded));
  });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => startEdit(entries.find(e => e.id == b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteEntry(entries.find(e => e.id == b.dataset.del)));
}
document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => {
  jFilter = b.dataset.filter;
  if (jFilter !== 'meal') mealSort = 'recent';
  renderMeals();
});
$('jsort').onchange = () => {
  mealSort = $('jsort').value; showAll = false;
  if (mealSort !== 'recent') jFilter = 'meal';
  renderMeals();
};

function markdown(md) {
  const out = []; let inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
  for (const raw of md.split('\n')) {
    const line = raw.trim();
    const bullet = /^[-*] /.test(line);
    if (inList && !bullet) { out.push('</ul>'); inList = false; }
    if (line.startsWith('#')) out.push(`<h3>${inline(line.replace(/^#+\s*/, ''))}</h3>`);
    else if (bullet) { if (!inList) { out.push('<ul>'); inList = true; } out.push(`<li>${inline(line.slice(2))}</li>`); }
    else if (line) out.push(`<p>${inline(line)}</p>`);
  }
  if (inList) out.push('</ul>');
  return out.join('');
}

async function loadSummary() {
  const r = await (await fetch('/summary')).json();
  aiAvailable = r.aiAvailable;
  $('genSummary').style.display = aiAvailable ? '' : 'none';
  const el = $('summaryText');
  if (r.summary) {
    el.className = 'summary';
    el.innerHTML = `<div class="muted small">${new Date(r.summary.periodStart).toLocaleDateString()} – ${new Date(r.summary.periodEnd).toLocaleDateString()}</div>` + markdown(r.summary.text);
  } else {
    el.className = 'summary muted small';
    el.textContent = 'A summary of the past 7 days is written every Sunday evening.';
  }
}
$('genSummary').onclick = async () => {
  $('genSummary').disabled = true; $('genSummary').textContent = 'Writing…';
  try {
    const r = await fetch(`/summary/generate?low=${LOW}&high=${HIGH}`, { method: 'POST' });
    if (!r.ok) throw new Error((await r.json()).error);
    await loadSummary();
  } catch (e) { alert(e.message); }
  $('genSummary').disabled = false; $('genSummary').textContent = 'Write now';
};

// --- logging ---
let kind = 'meal', photoData = null, lastEstimate = null, editing = null, removePhoto = false, doseTimer = null;
function setTime(date) {
  const d = new Date(date); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  $('time').value = d.toISOString().slice(0, 16);
}
function resetTime() { setTime(new Date()); }
resetTime();
function setKind(k) {
  kind = k;
  document.querySelectorAll('[data-kind]').forEach(x => x.classList.toggle('on', x.dataset.kind === k));
  $('mealForm').style.display = kind === 'meal' ? '' : 'none';
  $('insulinForm').style.display = kind === 'insulin' ? '' : 'none';
}
document.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { if (!editing) setKind(b.dataset.kind); });

function resetForm() {
  ['mealNote', 'carbs', 'insNote', 'photo'].forEach(id => $(id).value = '');
  $('units').value = 1; $('itype').value = 'rapid';
  photoData = null; lastEstimate = null; removePhoto = false; editing = null;
  $('preview').style.display = 'none'; $('estimateResult').textContent = '';
  $('logTitle').textContent = 'Log'; $('cancelEdit').style.display = 'none'; $('deleteEntry').style.display = 'none';
  $('alsoDose').checked = false;
  document.querySelectorAll('[data-kind]').forEach(x => x.disabled = false);
  resetTime(); updateDose();
}
function startEdit(e) {
  resetForm();
  editing = e;
  setKind(e.kind);
  document.querySelectorAll('[data-kind]').forEach(x => x.disabled = true);
  $('logTitle').textContent = e.kind === 'meal' ? 'Edit meal' : 'Edit insulin';
  $('cancelEdit').style.display = ''; $('deleteEntry').style.display = '';
  setTime(e.timestamp);
  if (e.kind === 'meal') {
    $('mealNote').value = e.note || ''; $('carbs').value = e.carbs ?? '';
    if (e.photo) { $('preview').src = e.photo; $('preview').style.display = 'block'; }
  } else {
    $('units').value = e.units; $('itype').value = e.insulinType || 'rapid'; $('insNote').value = e.note || '';
  }
  updateDose();
  $('log').scrollIntoView({ behavior: 'smooth' });
}
$('cancelEdit').onclick = resetForm;
async function deleteEntry(e) {
  if (!e || !confirm(`Delete ${e.kind === 'meal' ? '“' + (e.note || 'meal') + '”' : fmtU(e.units) + ' u insulin'}? This can't be undone.`)) return;
  await fetch(`/events/${e.id}`, { method: 'DELETE' });
  if (editing && editing.id === e.id) resetForm();
  load();
}
$('deleteEntry').onclick = () => deleteEntry(editing);

// Dose suggestion for a new meal eaten now
function updateDose() {
  clearTimeout(doseTimer);
  const carbs = Number($('carbs').value);
  const now = Math.abs(new Date($('time').value) - Date.now()) < 30 * 60e3;
  const show = !editing && kind === 'meal';
  $('alsoDoseRow').style.display = show ? '' : 'none';
  if (!show || !now || !(carbs > 0)) { $('doseBox').style.display = 'none'; return; }
  doseTimer = setTimeout(async () => {
    try {
      const r = await fetch(`/dose?carbs=${carbs}&target=120&low=${LOW}`);
      const s = await r.json();
      if (!r.ok) throw new Error(s.error);
      const u = x => `${x >= 0 ? '+' : '−'}${fmtU(Math.abs(x))} u`;
      const rows = [[`${Math.round(carbs)} g at 1 u per ${s.periodCarbRatio} g (${s.period})`, s.carbUnits]];
      if (s.glucose != null) rows.push([`Now ${s.glucose}, target ${s.target}, 1 u per ${s.sensitivity}`, s.correctionUnits]);
      if (s.trendUnits) rows.push(['Where the trend is heading in 30 min', s.trendUnits]);
      if (s.activeDeducted > 0) rows.push([`Insulin still active: ${fmtU(s.activeInsulin)} u, less what ${s.carbsOnBoard} g still digesting needs`, -s.activeDeducted]);
      const basis = s.meals < 3 ? `Mostly the usual rules for your ${fmtU(s.dailyDose)} u a day, until more meals are logged` : `Learned from ${s.meals} meals over ${Math.round(s.days)} days`;
      $('doseBox').innerHTML = `Suggested rapid insulin: <b>${fmtU(s.units)} u</b><div class="muted small">${basis}</div>`
        + (s.warning ? `<div class="warn small">${esc(s.warning)}</div>` : '')
        + `<details><summary class="small">How it's worked out</summary><table>${rows.map(([l, v]) => `<tr><td class="muted">${esc(l)}</td><td>${u(v)}</td></tr>`).join('')}<tr><td class="muted">Rounded down to the nearest half unit</td><td><b style="font-size:13px">${fmtU(s.units)} u</b></td></tr></table></details>`
        + '<div class="muted small" style="margin-top:6px">An estimate from your own logs, not medical advice.</div>';
      $('doseBox').style.display = '';
      if (!$('alsoDose').checked) $('doseUnits').value = s.units;
    } catch (e) { $('doseBox').innerHTML = `<span class="muted small">${esc(e.message)}</span>`; $('doseBox').style.display = ''; }
  }, 400);
}
$('carbs').oninput = updateDose;
$('time').onchange = updateDose;
updateDose();

$('photo').onchange = () => {
  const file = $('photo').files[0];
  if (!file) { photoData = null; $('preview').style.display = 'none'; return; }
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(1, 1568 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', 0.85);
    photoData = url.split(',')[1];
    $('preview').src = url; $('preview').style.display = 'block';
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(file);
};

$('estimate').onclick = async () => {
  const text = $('mealNote').value.trim();
  if (!photoData && !text) { $('estimateResult').textContent = 'Add a photo or a description first.'; return; }
  $('estimate').disabled = true; $('estimateResult').textContent = 'Asking Claude…';
  try {
    const r = await fetch('/meals/estimate', { method: 'POST', body: JSON.stringify({ photo: photoData, mediaType: 'image/jpeg', text: text || null }) });
    const est = await r.json();
    if (!r.ok) throw new Error(est.error);
    lastEstimate = est;
    $('carbs').value = Math.round(est.carbs);
    updateDose();
    if (!text) $('mealNote').value = est.description;
    $('estimateResult').innerHTML = est.items.map(i => `${esc(i.name)}: ${Math.round(i.carbs)} g`).join('<br>')
      + `<br>Confidence: ${esc(est.confidence)}${est.note ? ' · ' + esc(est.note) : ''}`;
  } catch (e) { $('estimateResult').textContent = e.message; }
  $('estimate').disabled = false;
};

$('save').onclick = async () => {
  const body = { timestamp: new Date($('time').value).toISOString() };
  if (kind === 'meal') {
    Object.assign(body, { note: $('mealNote').value.trim() || null, carbs: $('carbs').value ? Number($('carbs').value) : null });
    if (photoData) Object.assign(body, { photo: photoData, mediaType: 'image/jpeg' });
    if (lastEstimate) body.estimate = lastEstimate;
    if (!body.note && body.carbs == null && !photoData && !(editing && editing.photo)) { $('saveMsg').textContent = 'Add a photo, description or carbs.'; return; }
  } else {
    Object.assign(body, { units: Number($('units').value), insulinType: $('itype').value, note: $('insNote').value.trim() || null });
    if (!(body.units > 0)) { $('saveMsg').textContent = 'Enter the units.'; return; }
  }
  $('save').disabled = true;
  try {
    const r = editing
      ? await fetch(`/events/${editing.id}`, { method: 'PATCH', body: JSON.stringify(body) })
      : await fetch('/events', { method: 'POST', body: JSON.stringify({ kind, ...body }) });
    if (!r.ok) throw new Error((await r.json()).error);
    const dose = Number($('doseUnits').value);
    if (!editing && kind === 'meal' && $('alsoDose').checked && dose > 0) {
      await fetch('/events', { method: 'POST', body: JSON.stringify({ kind: 'insulin', timestamp: body.timestamp, units: dose, insulinType: 'rapid' }) });
    }
    $('saveMsg').textContent = 'Saved ✓';
    resetForm();
    load();
    setTimeout(() => $('saveMsg').textContent = '', 3000);
  } catch (e) { $('saveMsg').textContent = e.message; }
  $('save').disabled = false;
};

async function load() {
  [...seg.children].forEach(b => b.classList.toggle('on', b.textContent === hours + 'h'));
  try {
    const g = await (await fetch(`/glucose?hours=${hours}`)).json();
    const r = g.reading;
    if (r) {
      const el = $('value');
      el.textContent = r.mgdl; el.style.color = color(r.mgdl);
      $('arrow').textContent = r.arrow;
      $('delta').textContent = r.delta == null ? 'mg/dL' : `mg/dL  ${r.delta >= 0 ? '+' : ''}${r.delta}`;
      const mins = Math.round((Date.now() - Date.parse(r.timestamp)) / 60000);
      $('when').textContent = (mins < 1 ? 'Just now' : `${mins} min ago`) + (g.error ? ` · ${g.error}` : '');
    }
    renderForecast(g.forecast);
    renderInsulin(await (await fetch('/events?hours=24')).json());
    draw(g.history, g.forecast, g.events || []);
    $('estimate').disabled = !g.aiAvailable;
    $('estimate').title = g.aiAvailable ? '' : 'Claude is unavailable on the Mac';
    const st = await (await fetch(`/stats?low=${LOW}&high=${HIGH}`)).json();
    statBlock('today', st.today); statBlock('week', st.week);
    meals = await (await fetch(`/meals?days=30&low=${LOW}&high=${HIGH}`)).json();
    entries = await (await fetch('/events?hours=720')).json();
    renderMeals();
  } catch (e) {
    $('when').textContent = 'Server unreachable';
  }
}
load();
loadSummary();
setInterval(load, 60000);
</script>
